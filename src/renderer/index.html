<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Scott's Thoughts - Generation 1 Overlay - v1.5.0</title>
    <!-- base only; the active generation's stylesheet is a <style> element main.ts
         manages (applyModuleStyles), placed after this link so the cascade order is
         the one the two files had when they were one (plan 1.5, 3.1). -->
    <link rel="stylesheet" href="core/styles/base.css">
</head>
<body>
    <div id="app-container" class="gen-1">
        <!-- The root component's render function in main.ts draws here: the keyhook,
             then the pre-mapper screen (plan 3.2) or the detected module's overlay as a
             direct child of #app with no wrapper of its own (tools/parity/capture.ts
             roots gen4's comparison there). It was an in-DOM template until 2026-09-25,
             which kept Vue's runtime template compiler in the entry chunk. -->
        <div id="app"></div>
    </div>

    <!-- Imports -->
    <script type="module" src="/main.ts"></script>

    <!-- The 16:9 fit-to-window script that used to sit here is core/window/scaleToFit.ts,
         installed by main.ts for the modules that had it (gen1 included). -->
</body>
</html>

<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Scott's Thoughts - Generation 1 Overlay - v1.5.0</title>
    <!-- base only; the active generation's stylesheet is a <style> element main.ts
         manages (applyModuleStyles), placed after this link so the cascade order is
         the one the two files had when they were one (plan 1.5, 3.1). -->
    <link rel="stylesheet" href="core/styles/base.css">
</head>
<body>
    <div id="app-container" class="gen-1">
        <div id="app">
            <keyhook :table="hotkeys"></keyhook>
            <div v-if="ready == false">
                <div>Please load a mapper in PokeAByte...</div>
                <div v-if="unsupportedMapper">Unsupported mapper: {{ unsupportedMapper }}</div>
                <br>
                <no_mapper></no_mapper>
            </div>
            <!-- No wrapper: the overlay component's root is a direct child of #app, as
                 the legacy apps' v-else wrapper was, so the two trees line up from #app
                 down (tools/parity/capture.ts roots gen4's comparison there). -->
            <component v-else :is="overlayComponent" :game="game" ref="overlay"></component>
        </div>
    </div>

    <!-- Imports -->
    <script type="module" src="/main.ts"></script>

    <!-- Scaling script to maintain 16:9 aspect ratio -->
    <script>
        (function() {
            const DESIGN_WIDTH = 1920;
            const DESIGN_HEIGHT = 1080;

            function updateScale() {
                const appContainer = document.getElementById('app-container');
                if (!appContainer) return;

                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;

                const scaleX = viewportWidth / DESIGN_WIDTH;
                const scaleY = viewportHeight / DESIGN_HEIGHT;
                const scale = Math.min(scaleX, scaleY);

                appContainer.style.transform = `scale(${scale})`;
            }

            window.addEventListener('load', updateScale);
            window.addEventListener('resize', updateScale);
            updateScale();
        })();
    </script>
</body>
</html>
